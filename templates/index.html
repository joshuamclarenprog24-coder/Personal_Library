{% extends 'base.html' %}

{% block content%}
<h1 class="book_list_title">BOOKS</h1>
<table>
  <thead>
    <tr>
      <th> Title </th>
      <th> Author </th>
      <th> Completed</th>
      <th> Review </th>
    </tr>
  </thead>
  <tbody>
    {% for book in books %}
    <tr>
        <td>{{ book.title}} </td>
        <td> {{ book.author}} </td>
        <td> {{ book.completed}} </td>
        <td> {{ book.review}} </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
